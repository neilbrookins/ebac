<!doctype html>
<!-- EBaC in a web browser: the C program compiled to WebAssembly (ebac.mjs,
     ebac.wasm, and its files in ebac.data), running in this page, in
     xterm.js, with xterm-pty for its terminal, and the touch gestures of
     the Docker image's and the Home Assistant app's page (gestures.js).
     See web/README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EBaC</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  /* (laid out as ttyd's page: gestures.js sizes #terminal-container to
     the part of the page above a phone's keyboard, then sends "resize") */
  #terminal-container { width: 100%; height: 100%; margin: 0 auto; padding: 0; }
  #terminal-container .terminal { padding: 5px; height: calc(100% - 10px); }
  #loading { position: fixed; top: 1em; left: 1em; color: #fff;
             font: 16px sans-serif; }
  /* when EBaC has ended: as ttyd's "Press ⏎ to Reconnect" */
  #ended { display: none; position: fixed; inset: 0; z-index: 10;
           background: rgba(0, 0, 0, 0.6); color: #fff; cursor: pointer;
           font: 18px sans-serif; text-align: center;
           align-items: center; justify-content: center; }
  #ended div { background: rgba(60, 60, 60, 0.95); padding: 0.8em 1.2em;
               border-radius: 6px; }
</style>
</head>
<body>
<div id="loading">Loading EBaC&hellip;</div>
<div id="ended"><div>EBaC has ended.<br>Press &#x23CE; or tap to start it again.</div></div>
<div id="terminal-container"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="gestures.js"></script>
<script type="module">
  import { openpty } from "./xterm-pty.mjs";
  import initEbac from "./ebac.mjs";

  // white on black, as the Docker image's and the Home Assistant app's page
  // (13 pixels, as ttyd's: 50 columns on a phone, as EBaC's screens are made for)
  const term = new Terminal({
    fontSize: 13,
    theme: { foreground: "#ffffff", background: "#000000", cursor: "#ffffff",
             cursorAccent: "#000000", selectionBackground: "#5a5a5a",
             white: "#ffffff", brightWhite: "#ffffff" },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("terminal-container"));

  // The pty first, then the fit: the pty learns the terminal's size only
  // when it changes, and takes 80 by 24 until then, so a fit made before
  // it was there went unseen, and EBaC laid out a phone's screens 80 wide.
  const { master, slave } = openpty();
  term.loadAddon(master);
  fit.fit();
  window.addEventListener("resize", () => fit.fit());
  window.term = term;           // (gestures.js finds the terminal here)
  term.focus();

  // EBaC has ended (E on the main menu): say so, and start it again on
  // Enter or a tap, as ttyd's page offers to reconnect
  const ended = document.getElementById("ended");
  function ebacEnded() {
    term.options.disableStdin = true;
    term.blur();
    ended.style.display = "flex";
    ended.addEventListener("click", () => location.reload());
    window.addEventListener("keydown", (e) => {
      if (e.key === "Enter") location.reload();
    }, true);
  }

  // (Emscripten ends the program by throwing an ExitStatus, which the
  // browser would report as an error: it is the expected end, not one)
  window.addEventListener("unhandledrejection", (e) => {
    if (e.reason && e.reason.name === "ExitStatus") e.preventDefault();
  });

  initEbac({
    pty: slave,
    preRun: [(m) => {
      m.ENV.BIBLEROOT = "/ebac";
      m.ENV.TERM = "xterm";
      m.ENV.EBAC_GESTURES = "1";      // EBaC says which screen it shows
    }],
    onRuntimeInitialized: () => document.getElementById("loading").remove(),
    onExit: ebacEnded,
  });
</script>
</body>
</html>
