<!doctype html>
<!-- EBaC in a web browser: the C program compiled to WebAssembly (ebac.mjs,
     ebac.wasm, and its files in ebac.data), running in this page, in
     xterm.js, with xterm-pty for its terminal, and the touch gestures of
     the Docker image's and the Home Assistant app's page (gestures.js).
     See web/README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- (interactive-widget: a phone's keyboard makes the page itself shorter,
     not just covers it; see the style for html and body) -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>EBaC</title>
<!-- (a shortcut on the home screen, an "app": its name, icon, and opening
     full screen, without the browser's address bar; see #install below) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-title" content="EBaC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="xterm.css">
<style>
  /* The page never scrolls: it is the terminal, fitted to the part above
     a phone's keyboard. (On a phone, the browser scrolled the page up to
     show the terminal's typing box as the keyboard came, cutting off the
     top of the screen and leaving rows blank at the bottom, as on the
     first search after the page opened: found by the designer.) */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { position: fixed; inset: 0; display: flex; flex-direction: column; }
  /* (laid out as ttyd's page: gestures.js sizes #terminal-container to
     the part of the page above a phone's keyboard, then sends "resize") */
  #terminal-container { width: 100%; flex: 1 1 auto; min-height: 0;
                        margin: 0 auto; padding: 0; }
  /* (sized by gestures.js to the part above a phone's keyboard, where the
     page itself doesn't shrink for it: that height, not the room left) */
  #terminal-container[style*="height"] { flex: none; }
  /* the offer of a shortcut on the home screen, above the terminal (the
     terminal fits to what is left) */
  #install, #update { display: none; flex: none; align-items: center; gap: 0.6em;
             padding: 0.45em 0.6em; background: #26313d; color: #fff;
             font: 15px/1.3 sans-serif; border-bottom: 1px solid #3d4b5a; }
  #install img, #update img { width: 32px; height: 32px; border-radius: 7px; flex: none; }
  #install .text, #update .text { flex: 1 1 auto; }
  #install button, #update button { font: bold 15px sans-serif; border: 0; border-radius: 5px;
                    padding: 0.45em 0.8em; cursor: pointer; flex: none; }
  #install .add, #update .add { background: #ffd54f; color: #000; }
  #install .close, #update .close { background: transparent; color: #fff; font-size: 20px;
                    padding: 0.2em 0.4em; }
  #terminal-container .terminal { padding: 5px; height: calc(100% - 10px); }
  #loading { position: fixed; top: 1em; left: 1em; color: #fff;
             font: 16px sans-serif; }
  /* when EBaC has ended: as ttyd's "Press ⏎ to Reconnect" */
  #ended { display: none; position: fixed; inset: 0; z-index: 10;
           background: rgba(0, 0, 0, 0.6); color: #fff; cursor: pointer;
           font: 18px sans-serif; text-align: center;
           align-items: center; justify-content: center; }
  #ended div { background: rgba(60, 60, 60, 0.95); padding: 0.8em 1.2em;
               border-radius: 6px; }
</style>
</head>
<body>
<div id="loading">Loading EBaC&hellip;</div>
<div id="ended"><div>EBaC has ended.<br><span id="again">Press &#x23CE; or click to start it again.</span></div></div>
<div id="install" role="region" aria-label="Add EBaC to your home screen">
  <img src="icons/icon-180.png" alt="">
  <span class="text"></span>
  <button class="add" type="button">Install</button>
  <button class="close" type="button" aria-label="Close">&#x2715;</button>
</div>
<div id="update" role="region" aria-label="A newer EBaC">
  <img src="icons/icon-180.png" alt="">
  <span class="text">A newer EBaC is ready.</span>
  <button class="add" type="button">Update</button>
  <button class="close" type="button" aria-label="Not now">&#x2715;</button>
</div>
<div id="terminal-container"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="gestures.js"></script>
<script>
  /*
  ** The offer of a shortcut on the home screen (web/README.md): a bar above
  ** the terminal, the first time and every time until it is taken or
  ** closed, so that someone who came by a link or a QR code can find EBaC
  ** again without it. A web page can't add the shortcut itself; it can
  ** only ask the browser to offer it (Android's Chrome, and browsers made
  ** from it), or say how (an iPhone or iPad: Apple's browsers offer it
  ** only from the Share menu). Not where EBaC was opened from its icon
  ** already, and only on a touch screen (a computer's Chrome offers it in
  ** its own address bar).
  */
  (function () {
    const KEY = "ebac-install-bar";
    const bar = document.getElementById("install");
    const text = bar.querySelector(".text");
    const add = bar.querySelector(".add");
    const standalone = window.matchMedia("(display-mode: standalone)").matches ||
                       navigator.standalone === true;
    const touch = window.matchMedia("(pointer: coarse)").matches;
    const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    let closed = false, offer = null;
    try { closed = localStorage.getItem(KEY) === "closed"; } catch (e) { /* none kept */ }

    // (the terminal refitted to the room left, by the page's own resize)
    function show(on) {
      bar.style.display = on ? "flex" : "none";
      window.dispatchEvent(new Event("resize"));
    }
    function close() {
      try { localStorage.setItem(KEY, "closed"); } catch (e) { /* this time only */ }
      show(false);
    }
    bar.querySelector(".close").addEventListener("click", close);
    window.addEventListener("appinstalled", () => show(false));
    window.ebacInstallBar = () => bar.style.display === "flex";   // (test.mjs)
    if (standalone || closed || !touch)
      return;

    if (ios) {
      text.textContent = "Keep EBaC on your home screen: tap Share, then Add to Home Screen.";
      add.style.display = "none";
      show(true);
      return;
    }
    // Chrome on Android: its own offer kept back (no mini-bar of its own
    // as well), and made from this one's button
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      offer = e;
      text.textContent = "Keep EBaC on your home screen, to open it again later.";
      show(true);
    });
    add.addEventListener("click", async () => {
      if (!offer) return;
      offer.prompt();
      const { outcome } = await offer.userChoice;
      offer = null;
      show(false);      // (taken; or not now: offered again next time)
    });
  })();
</script>
<script type="module">
  import { openpty } from "./xterm-pty.mjs";
  import initEbac from "./ebac.mjs";

  // white on black, as the Docker image's and the Home Assistant app's page
  // (13 pixels, as ttyd's: 50 columns on a phone, as EBaC's screens are made for)
  const term = new Terminal({
    fontSize: 13,
    theme: { foreground: "#ffffff", background: "#000000", cursor: "#ffffff",
             cursorAccent: "#000000", selectionBackground: "#5a5a5a",
             white: "#ffffff", brightWhite: "#ffffff" },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("terminal-container"));

  // The pty first, then the fit: the pty learns the terminal's size only
  // when it changes, and takes 80 by 24 until then, so a fit made before
  // it was there went unseen, and EBaC laid out a phone's screens 80 wide.
  const { master, slave } = openpty();
  term.loadAddon(master);
  fit.fit();
  window.addEventListener("resize", () => fit.fit());
  // (and should the browser scroll it anyway, as it shows the keyboard)
  const unscroll = () => { if (window.scrollY || window.scrollX) window.scrollTo(0, 0); };
  window.addEventListener("scroll", unscroll);
  if (window.visualViewport) window.visualViewport.addEventListener("scroll", unscroll);
  window.term = term;           // (gestures.js finds the terminal here)
  term.focus();

  // EBaC has ended (E on the main menu): say so, and start it again on
  // Enter, a click or a tap, as ttyd's page offers to reconnect
  const ended = document.getElementById("ended");
  function ebacEnded() {
    save();
    // (on a touch screen, whose keyboard is hidden by now: a tap only)
    if (window.matchMedia("(pointer: coarse)").matches)
      document.getElementById("again").textContent = "Tap to start it again.";
    term.options.disableStdin = true;
    term.blur();
    ended.style.display = "flex";
    const restart = () => window.ebacSaved().then(() => location.reload());
    ended.addEventListener("click", restart);
    window.addEventListener("keydown", (e) => {
      if (e.key === "Enter") restart();
    }, true);
  }

  // (Emscripten ends the program by throwing an ExitStatus, which the
  // browser would report as an error: it is the expected end, not one)
  window.addEventListener("unhandledrejection", (e) => {
    if (e.reason && e.reason.name === "ExitStatus") e.preventDefault();
  });

  // EBaC's home folder, where it keeps the search history (.ebac_log), and
  // its folder of translations (BIBLEROOT), where A adds them, are kept in
  // the browser's storage for this site (IndexedDB), so they are there the
  // next time: read back before EBaC starts, and saved whenever they may
  // have changed. (Without that storage, as in a private window, they last
  // only while the page is open.)
  const HOME = "/home/web_user", ROOT = "/ebac", SITE = "/ebac-site";
  let ebac = null, FS = null, saving = false, again = false;
  function save() {
    if (!FS) return;
    if (saving) { again = true; return; }
    saving = true;
    FS.syncfs(false, () => {
      saving = false;
      if (again) { again = false; save(); }
    });
  }
  setInterval(save, 3000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") save();
  });
  window.addEventListener("pagehide", save);
  // (saved now, and when that is done: before the page is reloaded)
  window.ebacSaved = () => new Promise((resolve) => {
    if (!FS) return resolve();
    const wait = () => saving ? setTimeout(wait, 50) : FS.syncfs(false, () => resolve());
    wait();
  });

  // The translations that come with the site (in SITE), copied into EBaC's
  // folder: the first time, and again when the site is newer than the ones
  // there (each replaced, its line in trans too; the translations added
  // with A, and the order of trans, kept). Then SITE is let go of.
  function siteTranslations(fs) {
    const read = (p) => { try { return fs.readFile(p, { encoding: "utf8" }); } catch (e) { return null; } };
    const isDir = (p) => { try { return fs.isDir(fs.stat(p).mode); } catch (e) { return false; } };
    const names = (p) => fs.readdir(p).filter((n) => n !== "." && n !== "..");
    const remove = (p) => {
      if (isDir(p)) { names(p).forEach((n) => remove(p + "/" + n)); fs.rmdir(p); }
      else fs.unlink(p);
    };
    const copy = (from, to) => {
      if (isDir(from)) { fs.mkdir(to); names(from).forEach((n) => copy(from + "/" + n, to + "/" + n)); }
      else fs.writeFile(to, fs.readFile(from));
    };
    const site = read(SITE + "/.site");
    if (site !== null && site !== read(ROOT + "/.site")) {
      const lines = (t) => (t || "").split("\n").filter((l) => l.trim());
      const first = (l) => l.split(/\s/)[0];
      const theirs = lines(read(SITE + "/trans"));
      let trans = lines(read(ROOT + "/trans"));
      for (const line of theirs) {
        const name = first(line);
        if (isDir(ROOT + "/" + name)) remove(ROOT + "/" + name);
        copy(SITE + "/" + name, ROOT + "/" + name);
        const at = trans.findIndex((l) => first(l) === name);
        if (at >= 0) trans[at] = line; else trans.push(line);
      }
      fs.writeFile(ROOT + "/trans", trans.join("\n") + "\n");
      fs.writeFile(ROOT + "/.site", site);
    }
    if (isDir(SITE)) remove(SITE);
  }

  initEbac({
    pty: slave,
    preRun: [(m) => {
      ebac = m;
      m.ENV.BIBLEROOT = ROOT;
      m.ENV.TERM = "xterm";
      m.ENV.EBAC_GESTURES = "1";      // EBaC says which screen it shows
      m.FS.mkdir(ROOT);
      try {
        m.FS.mount(m.FS.filesystems.IDBFS, {}, HOME);
        m.FS.mount(m.FS.filesystems.IDBFS, {}, ROOT);
        m.addRunDependency("storage");
        m.FS.syncfs(true, (err) => {
          if (err) console.warn("EBaC: the browser's storage can't be read:", err);
          FS = m.FS;
          m.removeRunDependency("storage");
        });
      } catch (err) {
        console.warn("EBaC: no storage in this browser:", err);
      }
    }],
    // (after the storage is read and the site's files are in, before EBaC
    // starts)
    onRuntimeInitialized() {
      siteTranslations(ebac.FS);
      document.getElementById("loading").remove();
      save();
      keepUpToDate();
    },
    onExit: ebacEnded,
  });

  /*
  ** Kept for next time, and kept up to date (sw.js): the page's files,
  ** kept in the browser by its service worker, so that EBaC opens at once,
  ** and with no Internet at all, from the files it last had. A newer EBaC
  ** is looked for when the page opens, and whenever EBaC is brought back
  ** to the screen (a home-screen app, say, left running for days), in the
  ** background: no one waits for it, and with no Internet nothing happens.
  ** Once it is downloaded, a bar above the terminal offers it: Update
  ** (EBaC's files saved, then the page reloaded, as the newer one), or
  ** not now (offered again the next time). Looked for only once EBaC has
  ** started, so a first visit isn't slowed by it.
  */
  const updateBar = document.getElementById("update");
  let updating = false;
  function offerUpdate(waiting) {
    if (updating || !navigator.serviceWorker.controller) return;  // (a first visit: nothing to update)
    updateBar.style.display = "flex";
    window.dispatchEvent(new Event("resize"));
    updateBar.querySelector(".add").onclick = async () => {
      updating = true;
      updateBar.querySelector(".text").textContent = "Updating EBaC\u2026";
      await window.ebacSaved();
      waiting.postMessage("update");
    };
  }
  updateBar.querySelector(".close").addEventListener("click", () => {
    updateBar.style.display = "none";
    window.dispatchEvent(new Event("resize"));
  });
  window.ebacUpdateBar = () => updateBar.style.display === "flex";   // (test.mjs)
  function keepUpToDate() {
    if (!("serviceWorker" in navigator)) return;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (updating) location.reload();
    });
    navigator.serviceWorker.register("sw.js").then((reg) => {
      if (reg.waiting) offerUpdate(reg.waiting);
      reg.addEventListener("updatefound", () => {
        const next = reg.installing;
        next.addEventListener("statechange", () => {
          if (next.state === "installed") offerUpdate(next);
        });
      });
      const look = () => reg.update()
        .then(() => { if (reg.waiting) offerUpdate(reg.waiting); })
        .catch(() => { /* no Internet: as it is */ });
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") look();
      });
      setInterval(look, 6 * 60 * 60 * 1000);      // (and every 6 hours left open)
      window.ebacLookForUpdate = look;            // (test.mjs)
    }).catch((err) => console.warn("EBaC: not kept for use offline:", err));
  }
</script>
</body>
</html>
