<!doctype html>
<!-- EBaC in a web browser: the C program compiled to WebAssembly (ebac.mjs,
     ebac.wasm, and its files in ebac.data), running in this page, in
     xterm.js, with xterm-pty for its terminal, and the touch gestures of
     the Docker image's and the Home Assistant app's page (gestures.js).
     See web/README.md. -->
<html lang="en">
<head>
<meta charset="utf-8">
<!-- (interactive-widget: a phone's keyboard makes the page itself shorter,
     not just covers it; see the style for html and body) -->
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>EBaC</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="xterm.css">
<style>
  /* The page never scrolls: it is the terminal, fitted to the part above
     a phone's keyboard. (On a phone, the browser scrolled the page up to
     show the terminal's typing box as the keyboard came, cutting off the
     top of the screen and leaving rows blank at the bottom, as on the
     first search after the page opened: found by the designer.) */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { position: fixed; inset: 0; }
  /* (laid out as ttyd's page: gestures.js sizes #terminal-container to
     the part of the page above a phone's keyboard, then sends "resize") */
  #terminal-container { width: 100%; height: 100%; margin: 0 auto; padding: 0; }
  #terminal-container .terminal { padding: 5px; height: calc(100% - 10px); }
  #loading { position: fixed; top: 1em; left: 1em; color: #fff;
             font: 16px sans-serif; }
  /* when EBaC has ended: as ttyd's "Press ⏎ to Reconnect" */
  #ended { display: none; position: fixed; inset: 0; z-index: 10;
           background: rgba(0, 0, 0, 0.6); color: #fff; cursor: pointer;
           font: 18px sans-serif; text-align: center;
           align-items: center; justify-content: center; }
  #ended div { background: rgba(60, 60, 60, 0.95); padding: 0.8em 1.2em;
               border-radius: 6px; }
</style>
</head>
<body>
<div id="loading">Loading EBaC&hellip;</div>
<div id="ended"><div>EBaC has ended.<br><span id="again">Press &#x23CE; or click to start it again.</span></div></div>
<div id="terminal-container"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script src="gestures.js"></script>
<script type="module">
  import { openpty } from "./xterm-pty.mjs";
  import initEbac from "./ebac.mjs";

  // white on black, as the Docker image's and the Home Assistant app's page
  // (13 pixels, as ttyd's: 50 columns on a phone, as EBaC's screens are made for)
  const term = new Terminal({
    fontSize: 13,
    theme: { foreground: "#ffffff", background: "#000000", cursor: "#ffffff",
             cursorAccent: "#000000", selectionBackground: "#5a5a5a",
             white: "#ffffff", brightWhite: "#ffffff" },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById("terminal-container"));

  // The pty first, then the fit: the pty learns the terminal's size only
  // when it changes, and takes 80 by 24 until then, so a fit made before
  // it was there went unseen, and EBaC laid out a phone's screens 80 wide.
  const { master, slave } = openpty();
  term.loadAddon(master);
  fit.fit();
  window.addEventListener("resize", () => fit.fit());
  // (and should the browser scroll it anyway, as it shows the keyboard)
  const unscroll = () => { if (window.scrollY || window.scrollX) window.scrollTo(0, 0); };
  window.addEventListener("scroll", unscroll);
  if (window.visualViewport) window.visualViewport.addEventListener("scroll", unscroll);
  window.term = term;           // (gestures.js finds the terminal here)
  term.focus();

  // EBaC has ended (E on the main menu): say so, and start it again on
  // Enter, a click or a tap, as ttyd's page offers to reconnect
  const ended = document.getElementById("ended");
  function ebacEnded() {
    save();
    // (on a touch screen, whose keyboard is hidden by now: a tap only)
    if (window.matchMedia("(pointer: coarse)").matches)
      document.getElementById("again").textContent = "Tap to start it again.";
    term.options.disableStdin = true;
    term.blur();
    ended.style.display = "flex";
    const restart = () => window.ebacSaved().then(() => location.reload());
    ended.addEventListener("click", restart);
    window.addEventListener("keydown", (e) => {
      if (e.key === "Enter") restart();
    }, true);
  }

  // (Emscripten ends the program by throwing an ExitStatus, which the
  // browser would report as an error: it is the expected end, not one)
  window.addEventListener("unhandledrejection", (e) => {
    if (e.reason && e.reason.name === "ExitStatus") e.preventDefault();
  });

  // EBaC's home folder, where it keeps the search history (.ebac_log), is
  // kept in the browser's storage for this site (IndexedDB), so it is
  // there the next time: read back before EBaC starts, and saved whenever
  // it may have changed. (Without that storage, as in a private window,
  // it lasts only while the page is open.)
  const HOME = "/home/web_user";
  let FS = null, saving = false, again = false;
  function save() {
    if (!FS) return;
    if (saving) { again = true; return; }
    saving = true;
    FS.syncfs(false, () => {
      saving = false;
      if (again) { again = false; save(); }
    });
  }
  setInterval(save, 3000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "hidden") save();
  });
  window.addEventListener("pagehide", save);
  // (saved now, and when that is done: before the page is reloaded)
  window.ebacSaved = () => new Promise((resolve) => {
    if (!FS) return resolve();
    const wait = () => saving ? setTimeout(wait, 50) : FS.syncfs(false, () => resolve());
    wait();
  });

  initEbac({
    pty: slave,
    preRun: [(m) => {
      m.ENV.BIBLEROOT = "/ebac";
      m.ENV.TERM = "xterm";
      m.ENV.EBAC_GESTURES = "1";      // EBaC says which screen it shows
      try {
        m.FS.mount(m.FS.filesystems.IDBFS, {}, HOME);
        m.addRunDependency("home");
        m.FS.syncfs(true, (err) => {
          if (err) console.warn("EBaC: the browser's storage can't be read:", err);
          FS = m.FS;
          m.removeRunDependency("home");
        });
      } catch (err) {
        console.warn("EBaC: no storage in this browser:", err);
      }
    }],
    onRuntimeInitialized: () => document.getElementById("loading").remove(),
    onExit: ebacEnded,
  });
</script>
</body>
</html>
