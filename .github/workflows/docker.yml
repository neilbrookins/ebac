# The standalone image, ghcr.io/neilbrookins/ebac (see docker/README.md):
# built from each change to main that passes EBaC's tests (tests.yml),
# tested itself, and published for PCs (amd64)
# and ARM computers such as the Raspberry Pi (arm64, and arm/v7 for the
# 32-bit Raspberry Pi OS). Tagged "latest" and
# "sha-" and the commit. (The Home Assistant app builds from the same
# files, on each Home Assistant, at the commit it pins.)
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # EBaC's own tests first (tests.yml): an image is published only from a
  # change that passes them
  tests:
    uses: ./.github/workflows/tests.yml

  image:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The commit, as EBaC shows it
        id: commit
        run: |
          echo "text=$(git log -1 --format='%h, %cs')" >> "$GITHUB_OUTPUT"
          echo "short=$(git log -1 --format='%h')" >> "$GITHUB_OUTPUT"
          echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # First for this computer only, to test it before publishing.
      - name: Build (to test)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            EBAC_COMMIT=${{ steps.commit.outputs.text }}
            PACKAGES_REFRESH=${{ steps.commit.outputs.week }}
          # (the build's cache, kept between runs: an unchanged step, such
          # as the King James text's, gives the very same layer, so each
          # version of the image shares it; see docker/Dockerfile)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true
          tags: ebac:test

      - name: Test
        run: |
          set -e
          docker run -d --name ebac -p 7681:7681 -p 8080:8080 ebac:test
          for i in $(seq 30); do
            curl -fs http://localhost:7681/ -o page.html && break
            sleep 1
          done
          grep -q 'EBAC' page.html || { echo "page has no gestures"; exit 1; }
          curl -fs 'http://localhost:8080/cgi-bin/ebac/verse?ref=john+3:16' | tee verse.json
          grep -q 'everlasting life' verse.json
          curl -fs 'http://localhost:8080/cgi-bin/ebac/search?q=jesus+wept' | grep -q 'John 11:35'
          # (ebac-admin: nothing allowed, unless EBAC_ALLOW_ADD says so)
          curl -fs 'http://localhost:8080/cgi-bin/ebac-admin/permissions' | tee perms.json
          grep -q '"add": *false' perms.json
          docker logs ebac
          docker rm -f ebac
          # The plain terminal: EBaC starts, and Q at the main menu ends it
          printf 'q' | timeout 20 docker run -i --rm -e TERM=dumb ebac:test terminal > term.txt 2>&1 || true
          cat term.txt | head -20
          # Built for the commit
          docker run --rm --entrypoint sh ebac:test -c 'strings /usr/share/ebac/bible | grep -F "${{ steps.commit.outputs.short }}"'

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          build-args: |
            EBAC_COMMIT=${{ steps.commit.outputs.text }}
            PACKAGES_REFRESH=${{ steps.commit.outputs.week }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ghcr.io/neilbrookins/ebac:latest
            ghcr.io/neilbrookins/ebac:sha-${{ steps.commit.outputs.short }}

      # The layers of the image for PCs, and their sizes: from one version
      # to the next, the unchanged ones (the King James text, the packages
      # within a week) keep the same digest, so are stored once.
      - name: Layers
        run: |
          d=$(docker buildx imagetools inspect --raw ghcr.io/neilbrookins/ebac:sha-${{ steps.commit.outputs.short }} |
              jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest')
          docker buildx imagetools inspect --raw ghcr.io/neilbrookins/ebac@$d |
              jq -r '.layers[] | "\(.digest[7:19])  \(.size / 1048576 * 100 | round / 100) MB"'
