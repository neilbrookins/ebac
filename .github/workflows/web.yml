# EBaC in a web browser (web/README.md): the C source compiled to
# WebAssembly by Emscripten, tested in headless Chrome, and, from main,
# published with GitHub Pages (Settings > Pages > Source: GitHub Actions).
name: Web build

on:
  push:
    branches: [main, web]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # (Emscripten's version is pinned: xterm-pty works by changing some of
      # Emscripten's own functions, and is tested with 3.1.69 and the latest)
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.69
      - name: The page's parts
        working-directory: web
        run: npm install --no-audit --no-fund
      - name: Build
        run: sh web/build.sh
      - name: Test in a browser
        run: node web/test.mjs web/build/site
      - name: Experiment, the first search
        if: github.ref == 'refs/heads/web'
        run: node web/firstsearch.mjs web/build/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/site

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
